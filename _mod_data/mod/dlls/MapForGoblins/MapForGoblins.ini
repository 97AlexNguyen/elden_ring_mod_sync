; MapForGoblins configuration. Auto-generated from the in-code schema;
; the DLL re-syncs this file on launch (adds new keys, comments out removed ones).

[Goblin]
; Require map fragment discovery before showing icons in that area
require_map_fragments = true
; Tell apart the markers of the place you are IN from the ones that only
; look nearby: a dungeon sits under the overworld, so its icons land on the
; same spot of the map as the surface ones. Markers of your own map draw
; bigger, markers of any other map draw smaller. Nothing is ever hidden.
location_emphasis = true
; Horizontal position of the marker tooltip and the focus banner on the map screen. 100 = the corner they were authored for, 0 = the centre of the map area, above 100 = further left, below 0 = right of centre. Only needed if the panels sit wrong on your display; ultrawide setups have been reported. Takes effect immediately, no need to reopen the map.
map_panel_offset_percent = 100.00
; Size of the markers that belong to the map you are standing in (1.0 = unchanged).
location_emphasis_own_scale = 1.05
; Size of the markers that belong to any other map (1.0 = unchanged).
location_emphasis_other_scale = 0.95
; How much the markers of another map fade (1.0 = no fade, 0.2 = faintest).
; They stay fully visible and clickable - only quieter than the ones around you.
location_emphasis_other_fade = 0.75
; How far the markers of another map are pushed cold, on top of the fade
; (0.0 = colour untouched, 1.0 = strongest). Red and green drop, blue holds.
location_emphasis_other_cool = 0.90

