; Options for running alongside other mods that change item placement.
[Compatibility]
; Hide loot markers using the pickup flag from the loaded regulation, so they
; disappear correctly under the Item/Enemy Randomizer or other regulation mods.
live_loot_flags = true
; Relabel each loot marker with the item its lot currently gives, so names match
; the randomizer. Uses more memory (copies item names into the map's name table).
live_loot_labels = true
; Give each loot marker the icon and category of the item its lot currently
; gives, so icons and show_* toggles match the randomizer.
live_loot_icons = true
; Spoiler-free: every loot marker shows a gray "?" and a generic label instead
; of the real item. Overrides live_loot_labels/icons; markers still hide on pickup.
anonymous_loot = false

; The mod's MENU and the key/button that opens it. toggle_key (keyboard) /
; toggle_gamepad_combo (gamepad) OPEN the menu when menu_enabled is on, or toggle
; ALL map icons on/off when it is off. Which menu opens is menu_render_mode.
; Key names: F1-F24, A-Z, 0-9, Space, Escape, Tab, Enter, Backspace, Home, End,
; PageUp, PageDown, Insert, Delete, arrows.
[Menu & Hotkeys]
; The mod's menu on toggle_key / toggle_gamepad_combo. With this off those
; controls switch ALL map icons on/off instead, and no menu opens - which is
; also what to reach for if a DX overlay conflict (Steam overlay / RTSS /
; GeForce Experience) or a driver issue makes the game unstable with the
; overlay menu.
menu_enabled = true
; WHICH MENU the mod puts on toggle_key / toggle_gamepad_combo.
; native (default) - the in-game menu the game draws itself; the overlay is
; not created at all.
; imgui - the separate overlay window; the in-game menu is not injected (the
; map panels keep working, they have their own switch).
; Editable HERE ONLY: neither menu offers it, because it decides which menu
; exists. Change needs a game restart.
menu_render_mode = native
; Language of the OVERLAY menu: auto, english, schinese, tchinese, korean,
; russian, german, french, spanish. auto follows the Steam game language;
; unrecognized languages fall back to English. The in-game menu ignores this
; and always follows the GAME language.
overlay_ui_language = auto
; Overlay menu text size multiplier (1.0 = default). Raise on 4K / high-DPI
; screens if the menu text is too small. Also adjustable live from the slider at
; the top of the overlay's Settings tab.
overlay_font_scale = 1.00
; Overlay menu panel opacity, 0.3 to 1.0 (1.0 = solid). Lower it to see more
; of the map behind the menu. Also adjustable live from a slider in the Settings tab.
overlay_opacity = 1.00
; Overlay menu horizontal CENTER, fraction of screen width (0.5 = centered). Auto-saved.
overlay_window_x = 0.50
; Overlay menu TOP edge, fraction of screen height (0.0 = top). Auto-saved.
overlay_window_y = 0.03
; Overlay menu window width in pixels (auto-saved, clamped to screen).
overlay_window_w = 560.00
; Overlay menu window height in pixels (auto-saved, clamped to screen).
overlay_window_h = 680.00
; Let toggle_key / toggle_gamepad_combo switch ALL map icons on/off while
; menu_enabled is off. (With the menu on, those controls open it instead.)
enable_toggle_hotkey = true
; Keyboard key: OPENS the mod's menu when menu_enabled is on, or toggles ALL
; map icons on/off when it is off. Default: F10.
toggle_key = F10
; Gamepad combo, same role as toggle_key (opens the menu, or toggles all
; icons when menu_enabled is off). Tokens joined with '+': A,B,X,Y,LB,RB,
; L3/LSTICK,R3/RSTICK,BACK/SELECT/VIEW,START/MENU,UP/DOWN/LEFT/RIGHT.
; Default: Y+R3.
toggle_gamepad_combo = Y+R3
; Let you hide individual markers: hover a marker on the world map and press
; hide_marker_key to hide it. Hidden markers persist across sessions; un-hide them
; from the in-game menu (Hidden markers section).
enable_manual_hide = true
; Key that hides the map marker currently under the cursor. Default: Delete.
hide_marker_key = Delete
; Gamepad button that hides the map marker under the cursor (same as
; hide_marker_key). Tokens joined with '+'. Set it to 'none' to unbind - RB is
; also the map's own tab-switch button, so on a pad it is easy to hit by
; accident. Default: RB.
hide_marker_gamepad = RB
; Show a small passive panel (top-left) while the world map is open and the
; cursor is over a marker: the marker's name and its height relative to you
; ("N units above/below"). Never captures input.
hover_info = true

; Diagnostics, shown on the overlay's Debug tab.
[Debug]
; Enable verbose debug logging (memory addresses, param details, FMG internals)
debug_logging = true
; Master switch for the marker dump hotkey
enable_marker_dump = true
; Key to dump decoded markers to logs/MapForGoblins_markers.log. Default: F9.
marker_dump_key = F9
